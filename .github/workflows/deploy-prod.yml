name: CI/CD PROD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
            set -euo pipefail

            cd ~/apps/nanny-tracker

            echo "==> Updating repository"
            git fetch --prune origin main
            git reset --hard origin/main

            echo "==> Validating Docker Compose config"
            docker compose config >/dev/null

            echo "==> Cleaning up stale buildx state"
            docker buildx prune -f || true

            echo "==> Starting database services"
            docker compose up -d postgres pgadmin

            echo "==> Building and running migrations"
            timeout 300s docker compose --profile migrate build --progress=plain migrate

            docker ps -aq --filter "name=nanny-tracker-migrate-run" | xargs -r docker rm -f
            docker rm -f nanny_tracker_migrate_ci >/dev/null 2>&1 || true

            set +e
            timeout 180s docker compose --profile migrate run --rm -T --name nanny_tracker_migrate_ci migrate < /dev/null
            migrate_status=$?
            set -e

            if [ "$migrate_status" -eq 124 ]; then
              echo "==> Migration command timed out after 180 seconds; cleaning up stuck container and continuing"
              docker rm -f nanny_tracker_migrate_ci >/dev/null 2>&1 || true
            elif [ "$migrate_status" -ne 0 ]; then
              exit "$migrate_status"
            fi

            echo "==> Migrations finished"

            echo "==> Building backend image"
            timeout 600s docker compose build --progress=plain backend

            echo "==> Building frontend image without cache"
            timeout 900s docker compose build --progress=plain --no-cache frontend

            echo "==> Recreating application containers"
            docker compose up -d --force-recreate backend frontend nginx

            docker compose ps
          EOF